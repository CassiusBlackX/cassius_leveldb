# zal edit workload to test io on linux raid, used together with `properties/raid.properties`

# data size: 4GB = load 1GB + transaction 3GB
# note that transaction != insert, if want to make sure 4GB write, then insertproportion=1, and other proportion=0
# load 1GB = 524288 * 2KB
recordcount=524288

# insert !GB = 524288 * 2KB
operationcount=524288
insertproportion=1
readproportion=0
updateproportion=0
scanproportion=0
deleteproportion=0

workload=zal.test.io

requestdistribution=zipfian
zipfian_const=0.99

# zal add to control key&value length
## zeropadding should - 4 because there is a prefix "user" in every key
# key_len: 24 Bytes
zeropadding=20

## in order to have value length==1000, valuelength = (fieldlength + 14) * fieldcount
# BUG yet to figer out what `14` is
# value_len: 1000 Bytes
fieldlength=2010
fieldcount=1