# file here can use line comments, but not inline comments
# TODO edit dbname if on test server for the specific ssd/raid directory
leveldb.dbname=benchmarkdb
leveldb.format=single
leveldb.destroy=true

# according to wl test requirements, `write_buffer_size` and `max_file_size` should be the 4*1024*1024=4194304
leveldb.write_buffer_size=4194304
leveldb.max_file_size=4194304
leveldb.max_open_files=1000
leveldb.compression=snappy
leveldb.cache_size=134217728
leveldb.filter_bits=10
leveldb.block_size=4096
leveldb.block_restart_interval=16
